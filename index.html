    this.t = 0;
    this.sky   = buildSky();
    this.far   = buildRidge(1337, 604, 150, 26, '#4a2a63', '#2b1440', '#1b0c2c');
    this.near  = buildRidge(4242, 700,  92, 44, '#3a1c4e', '#170a26', '#0d0518');
    this.logoA = buildLogo('DRAGON', 13);
    this.logoB = buildLogo('STRIKER', 13);
    this.offFar = 0; this.offNear = 0;

    // 별
    const rnd = mulberry32(77);
    this.stars = [];
    for(let i=0;i<170;i++){
      this.stars.push({
        x: snap(rnd()*GAME_W), y: snap(rnd()*470),
        s: rnd() > 0.88 ? PX*2 : PX,
        ph: rnd()*Math.PI*2, sp: 1.2 + rnd()*2.6,
        c: rnd() > 0.8 ? PAL.cyan : (rnd() > 0.5 ? PAL.white : '#cbb6ff')
      });
    }
    // 구름 (지평선 근처, 느린 패럴랙스)
    this.clouds = [];
    for(let i=0;i<7;i++){
      this.clouds.push({
        x: rnd()*GAME_W, y: snap(340 + rnd()*160),
        w: snap(140 + rnd()*220), h: snap(12 + rnd()*16),
        sp: 5 + rnd()*9, c: rnd() > 0.5 ? '#3d1b4e' : '#4d2350'
      });
    }
    this.embers = [];
    this.emberT = 0;
    this.shoot  = null;
    this.shootT = 2.5;
  }

  update(dt){
    this.t += dt;
    this.offFar  = (this.offFar  + 6*dt)  % GAME_W;
    this.offNear = (this.offNear + 15*dt) % GAME_W;

    // 구름
    for(const c of this.clouds){
      c.x -= c.sp*dt;
      if(c.x + c.w < 0){ c.x = GAME_W + Math.random()*200; c.y = snap(340 + Math.random()*160); }
    }
    // 불씨 파티클
    this.emberT -= dt;
    if(this.emberT <= 0){
      this.emberT = 0.05 + Math.random()*0.07;
      this.embers.push({
        x: Math.random()*GAME_W, y: GAME_H + 8,
        vy: -(28 + Math.random()*55), sw: Math.random()*Math.PI*2,
        life: 0, max: 3.2 + Math.random()*2.6,
        s: Math.random() > 0.75 ? PX*2 : PX,
        c: PAL.fire[1 + Math.floor(Math.random()*4)]
      });
    }
    for(let i=this.embers.length-1; i>=0; i--){
      const e = this.embers[i];
      e.life += dt; e.y += e.vy*dt; e.sw += dt*2.2;
      if(e.life >= e.max || e.y < -10) this.embers.splice(i,1);
    }
    // 별똥별
    this.shootT -= dt;
    if(!this.shoot && this.shootT <= 0){
      this.shoot = { x: Math.random()*GAME_W*0.7, y: -20, vx: 220, vy: 150, life: 0 };
    }
    if(this.shoot){
      const s = this.shoot;
      s.life += dt; s.x += s.vx*dt; s.y += s.vy*dt;
      if(s.y > 460 || s.x > GAME_W + 40){ this.shoot = null; this.shootT = 4 + Math.random()*6; }
    }

    if(!this.mgr.busy && (Input.pressed('confirm') || Input.taps > 0)) this.mgr.change(new GameScene());
  }

  render(ctx){
    const t = this.t;
    ctx.drawImage(this.sky, 0, 0);

    // ---- 별 (반짝임) ----
    for(const st of this.stars){
      const a = 0.30 + 0.70 * (0.5 + 0.5*Math.sin(t*st.sp + st.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = st.c;
      ctx.fillRect(st.x, st.y, st.s, st.s);
      if(st.s > PX && a > 0.8){   // 큰 별은 십자 반짝임
        ctx.fillRect(st.x - PX, st.y + PX*0.5, PX, PX);
        ctx.fillRect(st.x + st.s, st.y + PX*0.5, PX, PX);
        ctx.fillRect(st.x + PX*0.5, st.y - PX, PX, PX);
        ctx.fillRect(st.x + PX*0.5, st.y + st.s, PX, PX);
      }
    }
    ctx.globalAlpha = 1;

    // ---- 별똥별 ----
    if(this.shoot){
      const s = this.shoot;
      for(let i=0;i<10;i++){
        ctx.globalAlpha = 1 - i/10;
        ctx.fillStyle = i < 3 ? PAL.white : PAL.cyan;
        ctx.fillRect(snap(s.x - s.vx*0.012*i), snap(s.y - s.vy*0.012*i), PX, PX);
      }
      ctx.globalAlpha = 1;
    }

    // ---- 달 ----
    const mx = 1096, my = 132;
    for(let i=3;i>=1;i--){
      ctx.globalAlpha = 0.05*i;
      fillPixelCircle(ctx, mx, my, 60 + i*14, '#ffdfa0');
    }
    ctx.globalAlpha = 1;
    fillPixelCircle(ctx, mx, my, 60, '#f7e6bd');
    fillPixelCircle(ctx, mx - 18, my - 14, 13, '#e2cda0');
    fillPixelCircle(ctx, mx + 20, my + 10, 17, '#e2cda0');
    fillPixelCircle(ctx, mx + 2,  my + 34, 9,  '#e2cda0');

    // ---- 구름 ----
    for(const c of this.clouds){
      ctx.fillStyle = c.c;
      const x = snap(c.x);
      ctx.fillRect(x, c.y, c.w, c.h);
      ctx.fillRect(x + snap(c.w*0.18), c.y - PX*2, snap(c.w*0.5), PX*2);
      ctx.fillRect(x + snap(c.w*0.34), c.y - PX*4, snap(c.w*0.24), PX*2);
      ctx.fillRect(x - PX*3, c.y + c.h - PX*2, c.w + PX*6, PX*2);
    }

    // ---- 산 (패럴랙스 2레이어) ----
    const fx = -snap(this.offFar), nx = -snap(this.offNear);
    blitRidge(ctx, this.far,  fx); blitRidge(ctx, this.far,  fx + GAME_W);
    blitRidge(ctx, this.near, nx); blitRidge(ctx, this.near, nx + GAME_W);

    // ---- 불씨 ----
    for(const e of this.embers){
      const k = e.life / e.max;
      ctx.globalAlpha = k < 0.15 ? k/0.15 : (1 - k) * 0.95;
      ctx.fillStyle = e.c;
      ctx.fillRect(snap(e.x + Math.sin(e.sw)*10), snap(e.y), e.s, e.s);
    }
    ctx.globalAlpha = 1;

    // ---- 로고 ----
    const bob = snap(Math.sin(t*1.6)*6);
    this.drawLogo(ctx, this.logoA, 640, 104 + bob, t);
    this.drawLogo(ctx, this.logoB, 640, 214 + bob, t + 0.35);

    // 장식 라인
    const lw = 300 + Math.round(Math.sin(t*2)*4)*PX;
    ctx.fillStyle = PAL.goldDim;
    ctx.fillRect(snap(640 - lw/2), 380, lw, PX);
    ctx.fillStyle = PAL.gold;
    ctx.fillRect(snap(640 - PX*5), 376, PX*10, PX*3);

    drawText(ctx, 'PIXEL DRAGON SHOOTER', 640, 400, 3,
      { align:'center', color:PAL.gold, shadow:'#000', spacing:4 });

    // ---- PRESS ENTER (깜빡임) ----
    const on = (t*1.55 % 1) < 0.62;
    if(on){
      drawText(ctx, 'PRESS ENTER TO START', 640, 462, 5,
        { align:'center', color:(r)=> r<2 ? PAL.white : PAL.gold, outline:PAL.outline, shadow:'#000', shadowOff:8 });
    }
    drawText(ctx, 'OR TAP / CLICK ANYWHERE', 640, 528, 2,
      { align:'center', color:PAL.dim, alpha:0.85 });

    // ---- 하단 정보 ----
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#000';
    ctx.fillRect(0, 656, GAME_W, 64); ctx.globalAlpha = 1;
    ctx.fillStyle = PAL.outline; ctx.fillRect(0, 652, GAME_W, PX);

    drawText(ctx, 'MOVE: WASD / ARROWS   MISSILE: Q   BOMB: E   PAUSE: ESC', 640, 672, 2,
      { align:'center', color:PAL.dim });
    drawText(ctx, 'PHASE 1 - V0.1', 1264, 700, 2, { align:'right', color:PAL.goldDim });
    drawText(ctx, 'F3: DEBUG', 16, 700, 2, { color:PAL.goldDim });

    if(DEBUG) drawHUDDebug(ctx);
  }

  /* 로고 1개 그리기: 소프트 블룸 + 픽셀 원본 */
  drawLogo(ctx, img, cx, y, t){
    const x = snap(cx - img.width/2);
    const g = 1.06, pulse = 0.16 + 0.10*Math.sin(t*2.2);
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = pulse;
    ctx.drawImage(img, x - img.width*(g-1)/2, y - img.height*(g-1)/2, img.width*g, img.height*g);
    ctx.globalAlpha = 1;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x, y);
  }
}

/* ==================================================================
   GameScene - Phase 2 : 이동 테스트
   (배경은 Phase 7 에서 20종 스테이지로 교체될 임시 플레이스홀더)
   ================================================================== */
const SKY_TEST = [
  {p:0.00,c:'#123a6b'},{p:0.28,c:'#1f5c96'},{p:0.52,c:'#3a8ab4'},
  {p:0.72,c:'#69b6c6'},{p:0.86,c:'#a4d9c8'},{p:1.00,c:'#dcefc4'}
];
const MAX_LIVES = 10;
const BOMB_ITEM_INTERVAL = 20;      // 20초마다 필살기 구슬 등장

class GameScene extends Scene {
  enter(){
    this.t = 0; this.stage = 1;
    this.sky  = buildSky(SKY_TEST);
    // 4층 패럴랙스 (원경 -> 전경). 전경은 플레이어보다 앞에 그려 스쳐 지나가게 한다
    this.far  = buildRidge(2024, 596, 132, 24, '#7d9ec4', '#4d6a99', '#3a5178');
    this.mid  = buildRidge(5150, 664, 104, 32, '#5d8a76', '#2c5344', '#1b3830');
    this.near = buildRidge(7788, 730,  74, 46, '#3f6b52', '#1e3b31', '#12251e');
    this.fg   = buildRidge(3311, 792,  66, 58, '#2b4436', '#0f1d18', '#070f0c');
    this.offFar = 0; this.offMid = 0; this.offNear = 0; this.offFg = 0;
    this.scrollK = 1;      // 플레이어 이동에 반응하는 스크롤 배율
    this.camLead = 0;      // 진행 방향으로 월드를 미는 카메라 리드

    this.player = new Player(320, GAME_H/2);
    this.stick  = new VirtualStick(STICK_CFG);
    this.btnMsl  = new TouchButton(1090, 612, 54, 'MSL',  '#8fd0ff');
    this.btnBomb = new TouchButton(1208, 520, 54, 'BOMB', PAL.gold);
    Input.pointerHandler = {
      down:(id,x,y) => {
        if(this.btnMsl.down(id,x,y)) return;
        if(this.btnBomb.down(id,x,y)) return;
        this.stick.down(id,x,y);
      },
      move:(id,x,y) => { this.stick.move(id,x,y); },
      up:  (id)     => { this.btnMsl.up(id); this.btnBomb.up(id); this.stick.up(id); }
    };

    // 전투 상태
    this.bolts = []; this.enemies = []; this.arrows = []; this.booms = [];
    this.eshots = []; this.missiles = []; this.bombs = []; this.waves = [];
    this.pmissiles = []; this.items = []; this.roars = [];
    this.fireT = 0; this.score = 0; this.kills = 0; this.hurtT = 0;
    this.boss = null; this.bossBannerT = 0; this.bossDeathT = 0;

    // 무기 / 생존 자원 (HP·하트 완전 연동은 Phase 6)
    this.missileCount = 0; this.bombCount = 0;   // 스테이지마다 0개부터 시작 (스펙 9.2)
    this.combo = 0; this.comboT = 0;
    this.killStreak = 0; this.bombItemT = BOMB_ITEM_INTERVAL; this.bombItemsLeft = 2;
    this.hp = 100; this.lives = 5;
    this.pickupMsg = null; this.pickupT = 0;

    this.director = new Director(this, this.stage);
    Particles.clear();

    const rnd = mulberry32(909);
    this.clouds = [];
    for(let i=0;i<12;i++)
      this.clouds.push({ x: rnd()*GAME_W, y: snap(40 + rnd()*380),
        w: snap(90 + rnd()*210), h: snap(12 + rnd()*16), sp: 34 + rnd()*58, a: 0.16 + rnd()*0.22 });
    this.lines = [];
    for(let i=0;i<70;i++)
      this.lines.push({ x: rnd()*GAME_W, y: snap(rnd()*GAME_H), len: snap(40+rnd()*110), sp: 900+rnd()*900 });
    // 전경 구름 (플레이어 앞을 아주 빠르게 스쳐 지나감)
    this.fgWisps = [];
    for(let i=0;i<7;i++)
      this.fgWisps.push({ x: rnd()*GAME_W*1.6, y: snap(30 + rnd()*640),
        w: snap(160 + rnd()*280), h: snap(10 + rnd()*20), sp: 1100 + rnd()*700, a: 0.10 + rnd()*0.12 });
  }
  exit(){ Input.pointerHandler = null; }

  muzzle(){
    const p = this.player, g = growthOf(p.level), f = FORMS[g.form];
    return { x: p.x + f.muzzle.x*g.cell, y: p.y + f.muzzle.y*g.cell };
  }
  onBossKilled(b){
    this.director.onBossKilled(b);
    if(this.boss === b) this.boss = null;
    const big = !(b instanceof MidBoss);
    this.bossDeathT = big ? 3.0 : 2.0;
    this.bossDeathX = b.x; this.bossDeathY = b.y; this.bossDeathR = big ? 150 : 100;
    Shake.add(big ? 16 : 11, big ? 1.0 : 0.6);
  }

  /* 적이 "격파"되었을 때만 호출 (화면 밖 소멸은 제외) */
  onEnemyKilled(e){
    if(e instanceof MidBoss){
      this.items.push(new Item(e.x, e.y, ITEM_KIND.POWER));            // 파워업 (불 레벨 +1)
      return;
    }
    if(e instanceof Boss){
      this.items.push(new Item(e.x - 40, e.y - 30, ITEM_KIND.HEART));  // 하트 고정 드롭
      this.items.push(new Item(e.x + 40, e.y + 30, ITEM_KIND.BOMB));   // 필살기 고정 드롭
      return;
    }
    this.killStreak++;
    if(this.killStreak % 4 === 0)                                      // 적 4마리마다 미사일 +1
      this.items.push(new Item(e.x, e.y, ITEM_KIND.MISSILE));
    else if(Math.random() < 0.15)                                      // 15% 사과
      this.items.push(new Item(e.x, e.y, ITEM_KIND.APPLE));
  }

  pickup(it){
    let msg = '';
    switch(it.kind){
      case ITEM_KIND.APPLE:   this.hp = Math.min(100, this.hp + 20); msg = 'HP +20%'; break;
      case ITEM_KIND.HEART:   this.lives = Math.min(MAX_LIVES, this.lives + 1); msg = 'LIFE +1'; break;
      case ITEM_KIND.MISSILE: this.missileCount++; msg = 'MISSILE +1'; break;
      case ITEM_KIND.BOMB:    this.bombCount++; msg = 'BOMB +1'; break;
      case ITEM_KIND.POWER:
        if(this.player.setLevel(this.player.level + 1)) msg = 'FIRE LV UP!';
        else msg = 'MAX LEVEL';
        break;
    }
    this.score += 50;
    this.pickupMsg = msg; this.pickupT = 1.2;
    Particles.spawn(it.x, it.y, 14, { spd:260, life:0.45, grav:-60,
      pal:['#ffffff','#ffe14a','#ffa32e','#ff7a1e'] });
  }

  update(dt){
    this.t += dt;
    const p = this.player;

    // ---- 이동 ----
    const sv = this.stick.vector();
    const mv = (sv.x || sv.y) ? sv : Input.moveVector();
    p.update(dt, mv);
    this.btnMsl.update(dt); this.btnBomb.update(dt);

    // ---- 파이어 블레스 ----
    const lv = p.level, c = FIRE[lv];
    this.fireT -= dt;
    if(this.fireT <= 0){
      this.fireT += FIRE_INTERVAL;
      const m = this.muzzle();
      if(c.n === 1) this.bolts.push(new FireBolt(m.x, m.y, 0, lv));
      else if(c.n === 2){
        this.bolts.push(new FireBolt(m.x, m.y - 9, -c.spread, lv));
        this.bolts.push(new FireBolt(m.x, m.y + 9,  c.spread, lv));
      }else{
        this.bolts.push(new FireBolt(m.x, m.y, 0, lv));
        this.bolts.push(new FireBolt(m.x, m.y, -c.spread, lv));
        this.bolts.push(new FireBolt(m.x, m.y,  c.spread, lv));
      }
      Particles.spawn(m.x, m.y, 2, { ang:0, spread:0.9, spd:210, life:0.16, grav:0, drag:5 });
    }

    // ---- 탄도미사일 (수동) ----
    if(this.comboT > 0) this.comboT -= dt;
    const wantMsl  = Input.pressed('missile') || this.btnMsl.consume();
    const wantBomb = Input.pressed('bomb')    || this.btnBomb.consume();
    const busyFx = this.roars.length > 0;

    if(wantMsl && this.missileCount > 0 && !busyFx){
      this.missileCount--;
      this.combo = (this.comboT > 0) ? Math.min(MISSILE.MAX_COMBO, this.combo + 1) : 1;
      this.comboT = MISSILE.COMBO_WINDOW;
      const n = this.combo * 3;                       // 3 -> 6 -> 9발
      const m = this.muzzle();
      const tg = pickTargets(this, m.x, m.y, n);
      const dmg = missileDamageOf(this.stage);
      for(let i=0;i<n;i++)
        this.pmissiles.push(new PlayerMissile(m.x, m.y, tg[i], dmg, i*0.045));
      Particles.spawn(m.x, m.y, 18, { ang:0, spread:1.7, spd:360, life:0.36 });  // 발사 화염 기둥
      Shake.add(5, 0.12);
      this.btnMsl.flash = 0.2;
    }

    // ---- 필살기 드래곤 뢰 (수동) ----
    if(wantBomb && this.bombCount > 0 && !busyFx){
      this.bombCount--;
      this.roars.push(new DragonRoar(this));
      this.btnBomb.flash = 0.3;
    }

    // ---- 웨이브 / 아이템 스폰 ----
    this.director.update(dt);
    if(this.bossBannerT > 0) this.bossBannerT -= dt;
    if(this.pickupT > 0) this.pickupT -= dt;
    if(this.bombItemsLeft > 0){                  // 스테이지당 2개 (스펙 3.4)
      this.bombItemT -= dt;
      if(this.bombItemT <= 0){
        this.bombItemT = BOMB_ITEM_INTERVAL;
        this.bombItemsLeft--;
        this.items.push(new Item(GAME_W + 50, 140 + Math.random()*420, ITEM_KIND.BOMB));
      }
    }

    if(this.bossDeathT > 0){
      this.bossDeathT -= dt;
      if(Math.random() < 0.55){
        const r = this.bossDeathR;
        this.booms.push(new Boom(this.bossDeathX + (Math.random()-0.5)*r*1.6,
                                 this.bossDeathY + (Math.random()-0.5)*r*1.4,
                                 30 + Math.random()*46, 0.4));
        Shake.add(6, 0.12);
      }
    }

    // ---- 갱신 ----
    for(const b of this.bolts)     b.update(dt);
    for(const e of this.enemies)   e.update(dt, this);
    for(const a of this.arrows)    a.update(dt);
    for(const e of this.eshots)    e.update(dt);
    for(const m of this.missiles)  m.update(dt);
    for(const b of this.bombs)     b.update(dt, this);
    for(const w of this.waves)     w.update(dt);
    for(const b of this.booms)     b.update(dt);
    for(const m of this.pmissiles) m.update(dt, this);
    for(const it of this.items)    it.update(dt);
    for(const r of this.roars)     r.update(dt, this);
    Particles.update(dt);
    Shake.update(dt);
    if(this.hurtT > 0) this.hurtT -= dt;

    // ---- 충돌: 불 vs 적 ----
    for(const b of this.bolts){
      if(b.dead) continue;
      const bb = b.box;
      for(const e of this.enemies){
        if(e.dead) continue;
        if(!overlap(bb, e.box)) continue;
        if(b.hitSet && b.hitSet.has(e)) continue;
        e.hit(b.dmg, b, this);
        if(e.dead) this.kills++;
        if(b.pierce > 0){ b.pierce--; (b.hitSet || (b.hitSet = new Set())).add(e); }
        else {
          b.dead = true;
          Particles.spawn(b.x, b.y, 6, { ang:Math.PI, spread:2.0, spd:240, life:0.26 });
          break;
        }
      }
    }
    // ---- 충돌: 아군 미사일 vs 적 (근접 시 폭발) ----
    for(const mi of this.pmissiles){
      if(mi.dead || mi.t < 0) continue;
      const mb = mi.box;
      for(const e of this.enemies){
        if(e.dead) continue;
        if(overlap(mb, e.box)){ mi.explode(this); break; }
      }
    }
    // ---- 아이템 획득 (히트박스보다 넉넉한 범위) ----
    const pb = { x:p.x - 46, y:p.y - 46, w:92, h:92 };
    for(const it of this.items){
      if(it.dead) continue;
      if(overlap(it.box, pb)){ this.pickup(it); it.dead = true; }
    }

    // ---- 격파 처리 (드롭) : 화면 밖 소멸과 구분하기 위해 killed 플래그 사용 ----
    for(const e of this.enemies){
      if(e.killed && !e.dropped){ e.dropped = true; this.onEnemyKilled(e); }
    }

    // ---- 충돌: 적 공격 vs 주인공 ----
    if(this.hurtT <= 0){
      const hb = p.hitbox;
      let struck = false;
      for(const list of [this.arrows, this.eshots, this.missiles, this.bombs]){
        for(const o of list){
          if(o.dead || !overlap(o.box, hb)) continue;
          if(o instanceof Bomb) o.explode(this); else o.dead = true;
          struck = true; break;
        }
        if(struck) break;
      }
      if(!struck) for(const e of this.enemies){ if(!e.dead && overlap(e.box, hb)){ struck = true; break; } }
      if(!struck) for(const w of this.waves){
        if(w.hitDone) continue;
        const d = Math.hypot(p.x - w.x, p.y - w.y);
        if(Math.abs(d - w.r) < 30){ w.hitDone = true; struck = true; break; }
      }
      if(struck) this.hurtPlayer();
    }

    // ---- 정리 ----
    this.bolts     = this.bolts.filter(o => !o.dead);
    this.enemies   = this.enemies.filter(o => !o.dead);
    this.arrows    = this.arrows.filter(o => !o.dead);
    this.eshots    = this.eshots.filter(o => !o.dead);
    this.missiles  = this.missiles.filter(o => !o.dead);
    this.bombs     = this.bombs.filter(o => !o.dead);
    this.waves     = this.waves.filter(o => !o.dead);
    this.booms     = this.booms.filter(o => !o.dead);
    this.pmissiles = this.pmissiles.filter(o => !o.dead);
    this.items     = this.items.filter(o => !o.dead);
    this.roars     = this.roars.filter(o => !o.dead);

    // ---- 배경 : 플레이어가 앞으로 밀수록 세상이 빨라진다 ----
    const drive = clamp(p.vx / PLAYER.SPEED, -1, 1);
    this.scrollK += (1 + drive*0.7 - this.scrollK) * Math.min(1, 4*dt);   // 0.3 ~ 1.7배
    this.camLead += (drive*30 - this.camLead) * Math.min(1, 5*dt);
    const K = this.scrollK;
    this.offFar  = (this.offFar  +  120*K*dt) % GAME_W;
    this.offMid  = (this.offMid  +  330*K*dt) % GAME_W;
    this.offNear = (this.offNear +  700*K*dt) % GAME_W;
    this.offFg   = (this.offFg   + 1350*K*dt) % GAME_W;
    for(const cl of this.clouds){
      cl.x -= cl.sp*K*dt;
      if(cl.x + cl.w < -20){ cl.x = GAME_W + Math.random()*260; cl.y = snap(40 + Math.random()*380); }
    }
    for(const l of this.lines){
      l.x -= l.sp*K*dt;
      if(l.x + l.len < -20){ l.x = GAME_W + Math.random()*300; l.y = snap(Math.random()*GAME_H); }
    }
    for(const w of this.fgWisps){
      w.x -= w.sp*K*dt;
      if(w.x + w.w < -40){ w.x = GAME_W + Math.random()*500; w.y = snap(30 + Math.random()*640); }
    }

    if(Input.pressed('lvup'))   p.setLevel(p.level + 1);
    if(Input.pressed('lvdown')) p.setLevel(p.level - 1);
    if(!this.mgr.busy && (Input.pressed('pause') || Input.pressed('back'))) this.mgr.change(new TitleScene());
  }

  hurtPlayer(){
    this.hurtT = 1.1;
    Shake.add(10, 0.25);
    const p = this.player;
    this.hp -= 25;
    if(this.hp <= 0){                       // 잔기 소모 (게임오버 처리는 Phase 6)
      this.hp = 100;
      this.lives = Math.max(0, this.lives - 1);
      p.setLevel(p.level - 1);              // 죽으면 불 레벨 -1
      this.hurtT = 1.8;
      Shake.add(14, 0.5);
      this.booms.push(new Boom(p.x, p.y, 120, 0.6));
    }
    Particles.spawn(p.x, p.y, 18, { spd:340, life:0.5, pal:['#fff','#ff9a5a','#ff4d5a','#8f1230'] });
  }

  render(ctx){
    ctx.drawImage(this.sky, 0, 0);
    for(const cl of this.clouds){
      ctx.globalAlpha = cl.a; ctx.fillStyle = '#ffffff';
      const x = snap(cl.x);
      ctx.fillRect(x, cl.y, cl.w, cl.h);
      ctx.fillRect(x + snap(cl.w*0.2), cl.y - PX*2, snap(cl.w*0.5), PX*2);
      ctx.fillRect(x - PX*2, cl.y + cl.h, snap(cl.w*0.7), PX*2);
    }
    ctx.globalAlpha = 1;
    // 4층 패럴랙스 + 카메라 리드 (가까운 층일수록 리드를 크게 받아 원근이 강조됨)
    const lead = this.camLead;
    const draw2 = (img, off, k) => {
      const x = -snap(((off + lead*k) % GAME_W + GAME_W) % GAME_W);
      blitRidge(ctx, img, x); blitRidge(ctx, img, x + GAME_W);
    };
    draw2(this.far,  this.offFar,  0.25);
    draw2(this.mid,  this.offMid,  0.55);
    draw2(this.near, this.offNear, 1.0);
    // 속도선 : 스크롤이 빠를수록 진하고 길어짐
    const sk = clamp((this.scrollK - 0.6) / 1.1, 0, 1);
    ctx.globalAlpha = 0.14 + sk*0.30; ctx.fillStyle = '#eaffff';
    for(const l of this.lines) ctx.fillRect(snap(l.x), l.y, snap(l.len*(0.6 + sk*0.9)), PX);
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(Shake.x, Shake.y);
    for(const e of this.enemies)   e.render(ctx);
    for(const a of this.arrows)    a.render(ctx);
    for(const e of this.eshots)    e.render(ctx);
    for(const m of this.missiles)  m.render(ctx);
    for(const b of this.bombs)     b.render(ctx);
    for(const it of this.items)    it.render(ctx);
    for(const b of this.bolts)     b.render(ctx);
    for(const m of this.pmissiles) m.render(ctx);

    const p = this.player;
    if(this.hurtT > 0 && Math.floor(this.hurtT*18) % 2 === 0){
      ctx.globalAlpha = 0.55; p.render(ctx); ctx.globalAlpha = 1;
    }else p.render(ctx);

    Particles.render(ctx);
    for(const w of this.waves) w.render(ctx);
    for(const b of this.booms) b.render(ctx);
    ctx.restore();

    // ---- 전경 (플레이어보다 앞. 가장 빠르게 스쳐 지나가 속도감을 만든다) ----
    const fgx = -snap(((this.offFg + this.camLead*1.6) % GAME_W + GAME_W) % GAME_W);
    blitRidge(ctx, this.fg, fgx); blitRidge(ctx, this.fg, fgx + GAME_W);
    for(const w of this.fgWisps){
      ctx.globalAlpha = w.a; ctx.fillStyle = '#ffffff';
      const x = snap(w.x);
      ctx.fillRect(x, w.y, w.w, w.h);
      ctx.fillRect(x + snap(w.w*0.25), w.y - PX, snap(w.w*0.45), PX);
    }
    ctx.globalAlpha = 1;

    for(const r of this.roars) r.render(ctx);      // 필살기 연출은 화면 전체 고정

    this.stick.render(ctx);
    this.btnMsl.render(ctx, this.missileCount);
    this.btnBomb.render(ctx, this.bombCount);
    this.renderHUD(ctx);
    if(DEBUG) this.renderDebug(ctx);
  }

  renderHUD(ctx){
    const p = this.player, g = growthOf(p.level);
    // HP 게이지
    ctx.fillStyle = '#0a1420'; ctx.fillRect(20, 18, 244, 22);
    ctx.fillStyle = '#20344d'; ctx.fillRect(24, 22, 236, 14);
    const hk = clamp(this.hp/100, 0, 1);
    ctx.fillStyle = hk > 0.5 ? '#5ee07a' : (hk > 0.25 ? '#ffd24a' : '#ff4d5a');
    ctx.fillRect(24, 22, snap(236*hk), 14);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(24, 22, snap(236*hk), 4);
    // 하트
    for(let i=0;i<MAX_LIVES;i++){
      const on = i < this.lives;
      ctx.fillStyle = on ? '#ff2b4a' : '#2b3448';
      const hx = 24 + i*22, hy = 48;
      const rows = ['.XX.XX.','XXXXXXX','.XXXXX.','..XXX..','...X...'];
      for(let r=0;r<rows.length;r++) for(let cc=0;cc<7;cc++)
        if(rows[r][cc] === 'X') ctx.fillRect(hx + cc*3, hy + r*3, 3, 3);
    }
    // 불 레벨
    drawText(ctx, 'FIRE LV ' + p.level, 24, 74, 4,
      { color:(r)=>PAL.fire[r], outline:PAL.outline, shadow:'#000', shadowOff:5 });
    for(let i=1;i<=MAX_LEVEL;i++){
      ctx.fillStyle = i <= p.level ? PAL.fire[Math.min(6, 6 - Math.floor(i*0.55))] : '#20344d';
      ctx.fillRect(24 + (i-1)*17, 106, 13, 8);
    }
    drawText(ctx, g.form === 'A' ? 'HATCHLING' : 'FULL GROWN', 24, 120, 2, { color:'#dff0ff', shadow:'#0a1830' });

    drawText(ctx, 'SCORE ' + String(this.score).padStart(7,'0'), 1264, 22, 4,
      { align:'right', color:PAL.gold, outline:PAL.outline, shadow:'#000', shadowOff:5 });
    drawText(ctx, 'KILL ' + this.kills, 1264, 60, 2, { align:'right', color:'#dff0ff', shadow:'#0a1830' });

    // 미사일 연속 사용 게이지
    if(this.comboT > 0 && this.combo > 0){
      drawText(ctx, 'x' + (this.combo*3) + ' MISSILE', 1090, 540, 3,
        { align:'center', color:PAL.fire[1], outline:PAL.outline });
      ctx.fillStyle = '#8fd0ff';
      ctx.fillRect(1090 - 50, 562, snap(100 * (this.comboT/MISSILE.COMBO_WINDOW)), 5);
    }
    // 획득 메시지
    if(this.pickupT > 0 && this.pickupMsg){
      drawText(ctx, this.pickupMsg, 640, 200, 5,
        { align:'center', color:PAL.gold, outline:PAL.outline, shadow:'#000',
          alpha: Math.min(1, this.pickupT/0.4) });
    }

    const b = this.boss;
    if(b && !b.dead){
      const w = 720, x = 640 - w/2, y = 148;
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(x - PX, y - PX, w + PX*2, 20 + PX*2);
      ctx.fillStyle = '#2a2030'; ctx.fillRect(x, y, w, 20);
      const k = clamp(b.hp / b.maxHp, 0, 1);
      ctx.fillStyle = b.enraged ? PAL.fire[5] : PAL.fire[3];
      ctx.fillRect(x, y, snap(w*k), 20);
      ctx.fillStyle = PAL.fire[1]; ctx.fillRect(x, y, snap(w*k), 6);
      drawText(ctx, b.name, 640, y - 26, 3, { align:'center', color:PAL.white, outline:PAL.outline, shadow:'#000' });
    }
    if(this.bossBannerT > 0 && Math.floor(this.bossBannerT*6) % 2 === 0){
      drawText(ctx, 'WARNING', 640, 300, 10,
        { align:'center', color:(r)=>PAL.fire[r], outline:PAL.outline, shadow:'#000', shadowOff:10 });
    }
    drawText(ctx, 'Q: MISSILE   E: BOMB   [ ]: LEVEL   ESC: TITLE', 640, 700, 2,
      { align:'center', color:'#cfe6ff', shadow:'#0a1830' });
  }

  renderDebug(ctx){
    const p = this.player, m = p.metrics, hb = p.hitbox;
    ctx.save(); ctx.translate(Shake.x, Shake.y);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#00ff88'; ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
    ctx.strokeStyle = 'rgba(255,80,120,.5)'; ctx.strokeRect(snap(p.x - m.w/2), snap(p.y - m.h/2), m.w, m.h);
    ctx.strokeStyle = '#ff4d5a';
    for(const e of this.enemies){ const b = e.box; ctx.strokeRect(b.x, b.y, b.w, b.h); }
    ctx.strokeStyle = '#ffd24a';
    for(const b of this.bolts){ const bb = b.box; ctx.strokeRect(bb.x, bb.y, bb.w, bb.h); }
    ctx.strokeStyle = '#ff9a5a';
    for(const list of [this.arrows, this.eshots, this.missiles, this.bombs])
      for(const o of list){ const ob = o.box; ctx.strokeRect(ob.x, ob.y, ob.w, ob.h); }
    ctx.strokeStyle = '#8fd0ff';
    for(const o of this.pmissiles){ const ob = o.box; ctx.strokeRect(ob.x, ob.y, ob.w, ob.h); }
    ctx.strokeStyle = '#ffffff';
    ctx.strokeRect(p.x - 46, p.y - 46, 92, 92);
    ctx.restore();

    const bs = this.boss;
    drawText(ctx, 'ENEMY ' + this.enemies.length + '  BOLT ' + this.bolts.length
      + '  PMSL ' + this.pmissiles.length + '  ITEM ' + this.items.length
      + '  ESHOT ' + (this.eshots.length + this.arrows.length + this.missiles.length + this.bombs.length)
      + '  PART ' + Particles.list.length, 16, 604, 2, { color:'#00ff88' });
    drawText(ctx, 'MSL ' + this.missileCount + '  BOMB ' + this.bombCount
      + '  COMBO ' + this.combo + '  STREAK ' + this.killStreak
      + '  MSLDMG ' + Math.round(missileDamageOf(this.stage)), 16, 622, 2, { color:'#00ff88' });
    drawText(ctx, 'WAVE ' + this.director.idx + '/' + TIMELINE.length
      + '  T ' + this.director.t.toFixed(1)
      + (bs ? ('  BOSS ' + bs.phase + ' ' + Math.max(0, Math.round(bs.hp))) : ''), 16, 640, 2, { color:'#00ff88' });
    drawText(ctx, 'HP ' + this.hp + '  LIVES ' + this.lives
      + '  DMG ' + FIRE[p.level].dmg + '  PIERCE ' + FIRE[p.level].pierce, 16, 658, 2, { color:'#00ff88' });
    drawHUDDebug(ctx);
  }
}

/* ==================================================================
   디버그 HUD
   ================================================================== */
let DEBUG = false;
const Perf = { fps: 0, _acc: 0, _n: 0, ms: 0 };
function drawHUDDebug(ctx){
  ctx.globalAlpha = 0.6; ctx.fillStyle = '#000'; ctx.fillRect(GAME_W-186, 8, 178, 40); ctx.globalAlpha = 1;
  drawText(ctx, 'FPS ' + Perf.fps, GAME_W-178, 14, 3, { color: Perf.fps >= 57 ? PAL.fire[1] : '#ff4d5a' });
  drawText(ctx, Perf.ms.toFixed(2) + ' MS', GAME_W-178, 34, 2, { color: PAL.dim });
}

/* ==================================================================
   부트스트랩 : 캔버스 / 리사이즈 / 방향 / 메인 루프
   ================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

const rotateEl = document.getElementById('rotate');
let portrait = false;

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  portrait = vh > vw;
  rotateEl.classList.toggle('show', portrait);
  const scale = Math.min(vw / GAME_W, vh / GAME_H);
  canvas.style.width  = Math.floor(GAME_W * scale) + 'px';
  canvas.style.height = Math.floor(GAME_H * scale) + 'px';
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

Input.init(canvas);

const scenes = new SceneManager();
scenes.set(new TitleScene());

const FIXED = 1/60, MAX_STEPS = 5;
let last = performance.now(), acc = 0;

document.addEventListener('visibilitychange', () => { if(!document.hidden) last = performance.now(); });

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;

  if(portrait){ acc = 0; Input.endFrame(); return; }   // 세로 모드: 게임 로직 완전 정지
  if(dt > 0.25) dt = 0.25;

  const t0 = performance.now();
  Input.pollPad();
  if(Input.pressed('debug')) DEBUG = !DEBUG;

  acc += dt;
  let steps = 0;
  while(acc >= FIXED && steps < MAX_STEPS){ scenes.update(FIXED); acc -= FIXED; steps++; }
  if(steps === MAX_STEPS) acc = 0;                     // 과부하 시 시간 누적 폐기

  scenes.render(ctx);
  if(steps > 0) Input.endFrame();                      // 고주사율에서 입력 유실 방지

  // FPS 측정
  Perf._acc += dt; Perf._n++;
  if(Perf._acc >= 0.5){ Perf.fps = Math.round(Perf._n / Perf._acc); Perf._acc = 0; Perf._n = 0; }
  Perf.ms = performance.now() - t0;
}
requestAnimationFrame(frame);
</script>
